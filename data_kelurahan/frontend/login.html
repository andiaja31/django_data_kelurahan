<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Sistem Kelurahan</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ALL CSS -->
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    .login-card {
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 25px 50px rgba(0,0,0,.35);
      animation: slideFade 0.8s ease;
    }

    @keyframes slideFade {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-title {
      font-weight: 800;
      text-align: center;
      margin-bottom: 6px;
    }

    .login-subtitle {
      text-align: center;
      color: #666;
      font-size: .9rem;
      margin-bottom: 24px;
    }

    .form-control {
      border-radius: 12px;
      padding: 10px 14px;
      transition: all .3s ease;
    }

    .form-control:focus {
      border-color: #2c5364;
      box-shadow: 0 0 0 .25rem rgba(44,83,100,.25);
    }

    .btn-login {
      border-radius: 12px;
      font-weight: 600;
      padding: 10px;
      transition: all .3s ease;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0,0,0,.25);
    }

    #alert-area .alert {
      animation: fadeIn .35s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* SHAKE ERROR */
    .shake {
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-6px); }
      100% { transform: translateX(0); }
    }

    .footer-text {
      text-align: center;
      font-size: .8rem;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="col-11 col-sm-9 col-md-6 col-lg-4">
  <div class="login-card">

    <h3 class="login-title">Login Sistem</h3>
    <div class="login-subtitle">Aplikasi Data Warga Kelurahan</div>

    <div id="alert-area"></div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label">Username / Email</label>
        <input type="text" class="form-control" id="username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>

      <div class="d-grid mt-4">
        <button type="submit" id="submit-btn" class="btn btn-primary btn-login">
          Masuk
        </button>
      </div>
    </form>

    <div class="footer-text">
      Gunakan akun yang terdaftar pada sistem
    </div>
  </div>
</div>

<!-- ALL JS -->
<script>
  const apiAuthUrl = 'http://127.0.0.1:8000/api/auth/token/';

  function showAlert(type, message) {
    const area = document.getElementById('alert-area');
    area.innerHTML = `<div class="alert alert-${type} mt-3">${message}</div>`;
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const btn = document.getElementById('submit-btn');
    const card = document.querySelector('.login-card');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Memproses...';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const resp = await fetch(apiAuthUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await resp.json();

      if (!resp.ok) {
        showAlert('danger', 'Login gagal. Username atau password salah.');
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);
        return;
      }

      const token = data.token || data.access || data.key;
      if (!token) {
        showAlert('warning', 'Login berhasil, tapi token tidak ditemukan.');
        return;
      }

      localStorage.setItem('authToken', token);
      localStorage.setItem('username', username);

      showAlert('success', 'Login berhasil! Mengalihkan...');
      setTimeout(() => window.location.href = 'index.html', 900);

    } catch (err) {
      console.error(err);
      showAlert('danger', 'Tidak dapat terhubung ke server.');
      card.classList.add('shake');
      setTimeout(() => card.classList.remove('shake'), 400);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
