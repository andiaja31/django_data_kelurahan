<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Pengaduan Warga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Pengaduan Warga</h1>
        <div>
            <a href="index.html" class="btn btn-sm btn-secondary me-2">Warga</a>
            <button id="btn-tambah-aduan" class="btn btn-sm btn-primary">
                Tambah Pengaduan
            </button>
        </div>
    </div>

    <div id="aduan-container">
        <div class="text-center my-5">
            <div class="spinner-border"></div>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH ADUAN -->
<div class="modal fade" id="aduanModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Tambah Pengaduan</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="aduan-form">
                    <div class="mb-3">
                        <label class="form-label">Judul</label>
                        <input id="aduan-judul" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Deskripsi</label>
                        <textarea id="aduan-deskripsi" class="form-control" rows="4" required></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                <button id="btn-simpan-aduan" class="btn btn-primary">Simpan</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="aduan.js"></script>
</body>
</html>
